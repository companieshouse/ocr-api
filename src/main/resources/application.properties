# Properties for the ocr-api

api.endpoint=/ocr-api

ocr.queue.capacity=${OCR_QUEUE_CAPACITY}
low.confidence.to.log=${LOW_CONFIDENCE_SCORE_TO_LOG}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

rest.client.timeout.seconds=300 

host.white.list=${HOST_WHITE_LIST}

tessdata.path=${TESSDATA_PREFIX}

# OpenTelemetry configuration
management.opentelemetry.enabled=${OTEL_LOG_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
management.opentelemetry.metrics.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
